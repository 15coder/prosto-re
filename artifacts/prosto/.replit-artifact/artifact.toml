kind = "web"
previewPath = "/"
title = "PROSTO Restaurant"
description = "A stunning animated landing page for PROSTO (بروستو) fast food restaurant in Iraq. Features cinematic food photography, iOS 27-inspired glass morphism design, smooth scroll animations, and the React Bits Stack component showcasing menu items. Single-page static site ready for Netlify deployment."
version = "1.0.0"
id = "artifacts/prosto"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26222

[services.development]
run = "pnpm --filter @workspace/prosto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prosto", "run", "build" ]
serve = "static"
publicDir = "artifacts/prosto/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26222"
BASE_PATH = "/"
